[tool.poetry]
name = "Automation module for Armis"
version = "1.0.0"
description = "Armis Centrix connector for Sekoia.io"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
sekoia-automation-sdk = ">=1.22.4"
requests = ">=2.31.0"
tenacity = ">=8.2.0"

[tool.poetry.dev-dependencies]
pytest = "*"
pytest-cov = "*"
pytest-mock = "*"
requests-mock = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 119

[tool.coverage.run]
omit = [
    "tests/*",
    "main.py",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
addopts = '''
  --strict-markers
  --tb=short
  --cov=armis_modules
  --cov-branch
  --cache-clear
  --cov-report=html
  --cov-report=term-missing:skip-covered
  --cov-fail-under=5
  --capture=sys
'''
